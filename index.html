<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全校班級顯示板</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #000; /* 視窗背景全黑，凸顯 16:9 區域 */
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 強制 16:9 比例的螢幕容器 */
        #screen-wrapper {
            width: 100%;
            max-width: 177.78vh; 
            aspect-ratio: 16/9;
            background-color: #1a202c;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 優化光暈效果 */
        .glow-effect {
            box-shadow: 0 0 20px #4ade80, 0 0 40px #16a34a; 
            background-color: #22c55e;
            color: #000000 !important; 
            border-color: #22c55e;
            transform: scale(1.02); 
            font-weight: 900 !important;
            z-index: 10;
        }
        
        .class-btn {
            transition: all 0.15s ease-out;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 32, 44, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- 這是我們的 16:9 虛擬螢幕 -->
    <div id="screen-wrapper" class="p-4 md:p-8 transition-all duration-500">
        
        <!-- 載入指示器 -->
        <div id="loading-overlay">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
            <p class="text-xl text-blue-300">正在連線至雲端同步系統...</p>
        </div>

        <!-- 控制列 -->
        <header id="main-header" class="w-full flex flex-col justify-between items-center z-20 transition-all duration-500">
            <div class="w-full flex flex-col md:flex-row justify-between items-center">
                <div class="text-center md:text-left">
                    <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                        全校班級顯示板
                    </h1>
                    <p class="mt-2 text-gray-400 text-xs md:text-sm flex items-center justify-center md:justify-start gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        即時同步 (每日 00:00 自動重置)
                    </p>
                </div>
                
                <!-- 右側控制區：包含 班級模式 與 顯示佈局 -->
                <div class="flex flex-col gap-2 items-end mt-4 md:mt-0">
                    <!-- 班級模式切換 (平日 vs 評估日) -->
                    <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                        <button onclick="changeClassMode('normal')" id="btn-class-normal" class="px-3 py-1 rounded text-sm font-bold transition-colors bg-purple-600 text-white">
                            平日模式 (28班)
                        </button>
                        <button onclick="changeClassMode('assessment')" id="btn-class-assessment" class="px-3 py-1 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white">
                            評估日 (33班)
                        </button>
                    </div>

                    <!-- 顯示佈局切換 (TV vs LED) -->
                    <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                        <button onclick="changeLayout('tv_mode')" id="btn-mode-tv" class="px-4 py-2 rounded text-sm font-bold transition-colors bg-blue-600 text-white">
                            TV模式
                        </button>
                        <button onclick="changeLayout('led_wall')" id="btn-mode-led" class="px-4 py-2 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white">
                            LED WALL 模式
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main id="board-container" class="w-full transition-all duration-500 z-10 mt-4">
            <!-- 班級按鈕將由 JS 生成 -->
        </main>

    </div>
    
    <!-- 引入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 設定與變數 ---
        const grades = [1, 2, 3, 4, 5, 6];
        const numToChinese = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
        
        window.currentLayout = 'tv_mode'; 
        window.currentClassMode = 'normal'; // 'normal' | 'assessment'

        // ----------------------------------------------------
        // 切換班級模式 (平日 / 評估日)
        // ----------------------------------------------------
        window.changeClassMode = function(mode) {
            window.currentClassMode = mode;

            // 更新按鈕樣式
            const normalBtn = document.getElementById('btn-class-normal');
            const assessBtn = document.getElementById('btn-class-assessment');

            if (mode === 'normal') {
                normalBtn.className = "px-3 py-1 rounded text-sm font-bold transition-colors bg-purple-600 text-white shadow-lg";
                assessBtn.className = "px-3 py-1 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white";
            } else {
                normalBtn.className = "px-3 py-1 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white";
                assessBtn.className = "px-3 py-1 rounded text-sm font-bold transition-colors bg-purple-600 text-white shadow-lg";
            }

            // 重新繪製畫面
            initBoard();
            if (window.lastData) applyDataToUI(window.lastData);
        };

        // ----------------------------------------------------
        // 切換顯示佈局 (TV / LED WALL)
        // ----------------------------------------------------
        window.changeLayout = function(mode) {
            window.currentLayout = mode;
            
            const tvBtn = document.getElementById('btn-mode-tv');
            const ledBtn = document.getElementById('btn-mode-led');
            const header = document.getElementById('main-header');
            const container = document.getElementById('board-container');
            const wrapper = document.getElementById('screen-wrapper');
            
            if (mode === 'tv_mode') {
                // === TV模式 ===
                tvBtn.className = "px-4 py-2 rounded text-sm font-bold transition-colors bg-blue-600 text-white shadow-lg";
                ledBtn.className = "px-4 py-2 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white";
                
                header.style.order = "0"; 
                header.classList.remove('mt-auto'); 
                header.classList.add('mb-2');
                
                container.style.order = "1";
                container.style.height = "auto";
                wrapper.classList.remove('justify-between');

            } else {
                // === LED WALL 模式 ===
                tvBtn.className = "px-4 py-2 rounded text-sm font-bold transition-colors text-gray-400 hover:text-white";
                ledBtn.className = "px-4 py-2 rounded text-sm font-bold transition-colors bg-teal-600 text-white shadow-lg";
                
                header.style.order = "2"; 
                header.classList.remove('mb-2');
                header.classList.add('mt-auto'); 
                
                container.style.order = "1";
                wrapper.classList.add('justify-between');
            }

            initBoard();
            if (window.lastData) applyDataToUI(window.lastData);
        };

        // ----------------------------------------------------
        // 取得班級列表 (核心邏輯)
        // ----------------------------------------------------
        function getClassesForGrade(grade) {
            let classes = ['A', 'B', 'C', 'D'];
            const mode = window.currentClassMode;

            // 1. 處理 E 班 (平日/評估日邏輯通用)
            // 2, 4, 5, 6 年級有 E 班
            if ([2, 4, 5, 6].includes(grade)) {
                classes.push('E');
            }

            // 2. 處理 評估日 特殊班級 (S, S1, S2)
            if (mode === 'assessment') {
                if (grade === 3) classes.push('S');
                if (grade === 4) classes.push('S');
                if (grade === 5) classes.push('S');
                if (grade === 6) classes.push('S1', 'S2');
            }

            return classes;
        }

        // 取得「所有」可能出現的班級，用於每日重置 (確保不遺漏)
        function getAllPossibleClasses(grade) {
            // 回傳平日與評估日的聯集
            let classes = ['A', 'B', 'C', 'D'];
            if ([2, 4, 5, 6].includes(grade)) classes.push('E');
            if (grade === 3) classes.push('S');
            if (grade === 4) classes.push('S');
            if (grade === 5) classes.push('S');
            if (grade === 6) classes.push('S1', 'S2');
            return classes;
        }

        function getHKDateString() {
            return new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Hong_Kong"});
        }

        // ================================================
        //  Firebase 設定
        // ================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCAnYlgsGceAYXKLlw0P-RS9N-1ydayxhc",
            authDomain: "claist-da546.firebaseapp.com",
            databaseURL: "https://claist-da546-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "claist-da546",
            storageBucket: "claist-da546.firebasestorage.app",
            messagingSenderId: "68170044054",
            appId: "1:68170044054:web:db2565be3216d3fc33e8b7",
            measurementId: "G-MVH87242TX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const COLLECTION_NAME = 'class_board_data';
        const DOC_ID = 'main_status'; 
        const statusDocRef = doc(db, COLLECTION_NAME, DOC_ID);

        const container = document.getElementById('board-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        let currentDbDate = null;
        window.lastData = {};

        // --- 1. 初始化畫面 ---
        function initBoard() {
            container.innerHTML = ''; 

            if (window.currentLayout === 'tv_mode') {
                // ================= TV模式 =================
                container.className = "w-full flex flex-col gap-3 mx-auto overflow-y-auto pr-2 custom-scrollbar";
                // 增加高度彈性，避免按鈕被切掉
                container.style.maxHeight = "calc(100vh - 120px)"; 

                grades.forEach(grade => {
                    const currentClasses = getClassesForGrade(grade);
                    const row = document.createElement('div');
                    row.className = 'bg-gray-800/50 rounded-lg p-2 md:p-3 border border-gray-700/50 flex flex-col md:flex-row items-center gap-3';
                    
                    const titleContainer = document.createElement('div');
                    titleContainer.className = 'flex items-center justify-center md:justify-start w-full md:w-24 shrink-0 border-b md:border-b-0 md:border-r border-gray-600 pb-2 md:pb-0 md:pr-4';
                    
                    const title = document.createElement('h2');
                    title.className = 'text-lg md:text-xl font-bold text-blue-300';
                    title.innerText = `${numToChinese[grade]}年`;
                    titleContainer.appendChild(title);
                    row.appendChild(titleContainer);

                    const btnContainer = document.createElement('div');
                    // 根據班級數量自動調整 grid
                    const colCount = currentClasses.length > 6 ? 8 : 6;
                    btnContainer.className = `grid grid-cols-4 md:grid-cols-${colCount} gap-2 w-full`;

                    currentClasses.forEach(cls => {
                        createButton(grade, cls, btnContainer, 'tv_mode');
                    });
                    row.appendChild(btnContainer);
                    container.appendChild(row);
                });

            } else {
                // ================= LED WALL 模式 =================
                // 25% 高度限制
                container.className = "w-full grid grid-cols-6 gap-1 px-1 h-[25%] items-start";
                // 強制重設高度
                container.style.maxHeight = "none";

                grades.forEach(grade => {
                    const currentClasses = getClassesForGrade(grade);
                    const col = document.createElement('div');
                    col.className = 'flex flex-col gap-0.5 h-full';
                    
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'flex flex-col gap-0.5 w-full h-full';

                    currentClasses.forEach(cls => {
                        createButton(grade, cls, btnContainer, 'led_wall', currentClasses.length);
                    });
                    col.appendChild(btnContainer);
                    container.appendChild(col);
                });
            }
        }

        // 輔助函式：建立按鈕
        function createButton(grade, cls, parent, mode, classCount = 0) {
            const btn = document.createElement('button');
            const classId = `${grade}${cls}`;
            
            btn.id = `btn-${classId}`;
            
            if (mode === 'tv_mode') {
                // TV模式
                btn.className = `class-btn h-10 md:h-12 rounded-lg font-bold text-lg md:text-xl border border-gray-600 text-gray-400 hover:border-blue-400 hover:text-blue-300 focus:outline-none select-none bg-gray-900`;
            } else {
                // LED WALL 模式
                btn.className = `class-btn flex-1 w-full rounded font-black border-2 border-gray-600 text-gray-500 hover:border-blue-400 hover:text-blue-300 focus:outline-none select-none bg-gray-900 leading-none tracking-wider flex items-center justify-center`;
                
                // 動態字體大小計算
                // 如果該年級班級數多 (如小六評估日有7班)，字體要稍微縮小以塞入空間
                if (classCount >= 7) {
                    btn.style.fontSize = "clamp(1rem, 2.5vh, 2rem)"; // 較小
                } else {
                    btn.style.fontSize = "clamp(1.5rem, 4vh, 3rem)"; // 較大
                }
            }
            
            btn.innerText = classId;
            btn.onclick = () => handleBtnClick(classId);
            parent.appendChild(btn);
        }

        // --- 2. 處理點擊邏輯 ---
        async function handleBtnClick(classId) {
            if (!auth.currentUser) return;
            const btn = document.getElementById(`btn-${classId}`);
            if (!btn) return;
            
            const isCurrentlyLit = btn.classList.contains('glow-effect');
            const newState = !isCurrentlyLit;

            try {
                await setDoc(statusDocRef, { [classId]: newState }, { merge: true });
            } catch (error) {
                console.error("更新失敗:", error);
            }
        }

        // --- 3. 自動重置邏輯 (優化版) ---
        async function performDailyReset(todayStr) {
            console.log("執行自動重置:", todayStr);
            const resetData = { lastResetDate: todayStr };
            
            // 掃描所有可能的班級進行重置
            grades.forEach(g => {
                getAllPossibleClasses(g).forEach(c => {
                    resetData[`${g}${c}`] = false;
                });
            });
            
            try { await setDoc(statusDocRef, resetData); } catch (e) { console.error(e); }
        }

        // --- 4. 監聽資料庫變更 ---
        function setupRealtimeListener() {
            onSnapshot(statusDocRef, (docSnapshot) => {
                const data = docSnapshot.data() || {};
                window.lastData = data; 
                
                currentDbDate = data.lastResetDate;
                const today = getHKDateString();
                if (currentDbDate !== today) {
                    performDailyReset(today);
                    return; 
                }

                applyDataToUI(data); 
                loadingOverlay.style.display = 'none';
            }, (error) => {
                console.error("同步錯誤:", error);
                loadingOverlay.innerHTML = `<p class="text-red-400">連線中斷<br><span class="text-sm">${error.message}</span></p>`;
            });

            setInterval(() => {
                const today = getHKDateString();
                if (currentDbDate && currentDbDate !== today) performDailyReset(today);
            }, 60000); 
        }

        function applyDataToUI(data) {
            // 無論現在顯示什麼模式，我們都嘗試更新所有存在的按鈕
            // 這樣切換模式時，狀態也能保持
            const allBtns = document.querySelectorAll('button[id^="btn-"]');
            allBtns.forEach(btn => {
                const classId = btn.id.replace('btn-', '');
                const isActive = data[classId] === true;
                updateButtonUI(classId, isActive);
            });
        }

        function updateButtonUI(classId, isActive) {
            const btn = document.getElementById(`btn-${classId}`);
            if (!btn) return;

            if (isActive) {
                btn.classList.add('glow-effect', 'border-transparent');
                btn.classList.remove('border-gray-600', 'text-gray-400', 'text-gray-500', 'bg-gray-900');
            } else {
                btn.classList.remove('glow-effect', 'border-transparent');
                const defaultTextColor = window.currentLayout === 'led_wall' ? 'text-gray-500' : 'text-gray-400';
                btn.classList.add('border-gray-600', defaultTextColor, 'bg-gray-900');
            }
        }

        async function startApp() {
            // 預設
            window.changeClassMode('normal');
            window.changeLayout('tv_mode'); 

            try { await signInAnonymously(auth); } 
            catch (error) { 
                console.error("登入失敗:", error);
                loadingOverlay.innerHTML = `<p class="text-red-400 text-center px-4">API 設定錯誤<br><span class="text-xs">${error.code}</span></p>`;
            }

            onAuthStateChanged(auth, (user) => {
                if (user) setupRealtimeListener();
            });
        }

        startApp();
    </script>
</body>
</html>
