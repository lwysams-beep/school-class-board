<!-- Version 1.9 - 香海正覺蓮社佛教正覺蓮社學校 - 全校班級顯示板 (升級各年級與班別獨立 4 音和弦鈴聲) -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全校班級顯示板 v1.9</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #000; /* 視窗背景全黑 */
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 螢幕容器 */
        #screen-wrapper {
            width: 100%;
            max-width: 177.78vh; 
            aspect-ratio: 16/9;
            background-color: #1a202c;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        /* =========================================
           年級專屬顏色光暈設定 (彩虹色系)
           ========================================= */
        [class*="glow-"] {
            transform: scale(1.02); 
            font-weight: 900 !important;
            z-index: 10;
            border-color: transparent !important;
        }

        /* 1年級：粉紅色 */
        .glow-1 {
            box-shadow: 0 0 20px #ec4899, 0 0 40px #be185d; 
            background-color: #ec4899; 
            color: #ffffff !important; 
        }

        /* 2年級：橙色 */
        .glow-2 {
            box-shadow: 0 0 20px #f97316, 0 0 40px #c2410c; 
            background-color: #f97316; 
            color: #ffffff !important; 
        }

        /* 3年級：黃色 */
        .glow-3 {
            box-shadow: 0 0 20px #eab308, 0 0 40px #a16207; 
            background-color: #eab308; 
            color: #000000 !important; 
        }

        /* 4年級：綠色 */
        .glow-4 {
            box-shadow: 0 0 20px #22c55e, 0 0 40px #15803d; 
            background-color: #22c55e; 
            color: #000000 !important; 
        }

        /* 5年級：藍色 */
        .glow-5 {
            box-shadow: 0 0 20px #3b82f6, 0 0 40px #1d4ed8; 
            background-color: #3b82f6; 
            color: #ffffff !important; 
        }

        /* 6年級：紫色 */
        .glow-6 {
            box-shadow: 0 0 20px #a855f7, 0 0 40px #7e22ce; 
            background-color: #a855f7; 
            color: #ffffff !important; 
        }
        
        .class-btn {
            transition: all 0.15s ease-out;
            -webkit-tap-highlight-color: transparent;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 32, 44, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            flex-direction: column;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #2d3748; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4a5568; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #718096; 
        }
    </style>
</head>
<body>

    <div id="screen-wrapper" class="p-4 md:p-8">
        
        <div id="loading-overlay">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
            <p class="text-xl text-blue-300">正在連線至雲端同步系統...</p>
        </div>

        <header id="main-header" class="w-full flex flex-col justify-between items-center z-20 transition-all duration-500 flex-shrink-0">
            <div class="w-full flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0">
                <div class="text-center md:text-left">
                    <h1 class="text-2xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
                        全校班級顯示板 <span class="text-xs text-gray-500 font-normal">v1.9</span>
                    </h1>
                    <p class="mt-1 md:mt-2 text-gray-400 text-xs md:text-sm flex items-center justify-center md:justify-start gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        即時同步 (每日 00:00 自動重置)
                    </p>
                </div>
                
                <!-- 控制按鈕區域 -->
                <div class="flex flex-wrap gap-2 items-center justify-center md:justify-end w-full md:w-auto">
                    <!-- 音效開關按鈕 -->
                    <button onclick="toggleSound()" id="btn-sound-toggle" class="px-3 py-2 rounded text-xs md:text-sm font-bold bg-green-600 hover:bg-green-500 text-white flex items-center gap-1 shadow transition-colors">
                        <span id="sound-icon">🔊</span> 音效: 開
                    </button>

                    <!-- 班級模式切換 -->
                    <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                        <button onclick="changeClassMode('normal')" id="btn-class-normal" class="px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors bg-purple-600 text-white">
                            平日 (28)
                        </button>
                        <button onclick="changeClassMode('assessment')" id="btn-class-assessment" class="px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white">
                            評估日 (32)
                        </button>
                    </div>

                    <!-- 顯示佈局切換 -->
                    <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700 overflow-x-auto">
                        <button onclick="changeLayout('tv_mode')" id="btn-mode-tv" class="px-3 md:px-4 py-1 rounded text-xs md:text-sm font-bold transition-colors bg-blue-600 text-white whitespace-nowrap">
                            TV模式
                        </button>
                        <button onclick="changeLayout('led_wall')" id="btn-mode-led" class="px-3 md:px-4 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white whitespace-nowrap">
                            LED WALL
                        </button>
                        <button onclick="changeLayout('mobile_mode')" id="btn-mode-mobile" class="px-3 md:px-4 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white whitespace-nowrap">
                            手機模式
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 區域一：班別表格區 -->
        <main id="board-container" class="w-full transition-all duration-500 z-10 mt-4 custom-scrollbar">
            <!-- JS 動態生成班級按鈕 -->
        </main>

        <!-- 區域二：排隊/線段表格區 -->
        <div id="led-lines-container" class="w-full hidden z-10 mt-6 pt-4 border-t-2 border-teal-500/40 mb-2">
            <!-- JS 動態生成線段 -->
        </div>

    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const lineData = [
            { id: 14, name: "欣盛",         extraRow: "" },
            { id: 13, name: "華明<br>景盛", extraRow: "" },
            { id: 12, name: "牽晴間<br>華心", extraRow: "" },
            { id: 11, name: "祥華<br>碧湖", extraRow: "" },
            { id: 10, name: "火車站",       extraRow: "" },
            { id: 9,  name: "火車站",       extraRow: "" },
            { id: 8,  name: "皇后山校車",   extraRow: "" },
            { id: 7,  name: "皇后山校車",   extraRow: "" },
            { id: 6,  name: "跨境車<br>文錦渡", extraRow: "" },
            { id: 5,  name: "跨境車<br>福田",   extraRow: "" },
            { id: 4,  name: "跨境車<br>蓮塘",   extraRow: "" },
            { id: 3,  name: "1車",          extraRow: "" },
            { id: 2,  name: "3車",          extraRow: "" },
            { id: 1,  name: "11車",         extraRow: "" }
        ];

        const grades = [1, 2, 3, 4, 5, 6];
        const numToChinese = { 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六' };
        
        window.currentLayout = 'tv_mode'; 
        window.currentClassMode = 'normal'; 
        window.isSoundEnabled = true;
        window.isLedWallSwapped = false;

        // Web Audio Context
        let audioCtx = null;

        // =========================================================================
        // Version 1.8 升級版音效模組 (每級基音不同 + 各班和弦獨立)
        // =========================================================================
        const notes = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
            'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77,
            'C6': 1046.50
        };

        function playTone(freq, startTime, duration) {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc1.frequency.value = freq;

            osc2.type = 'triangle';
            osc2.frequency.value = freq;

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const volume = 0.2;
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc1.start(startTime);
            osc1.stop(startTime + duration);
            osc2.start(startTime);
            osc2.stop(startTime + duration);
        }

        function playChime(classId) {
            if (!window.isSoundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const grade = parseInt(classId.charAt(0));
            let cls = classId.substring(1);
            if (cls.startsWith('S')) cls = 'S';

            const now = audioCtx.currentTime;
            const noteDuration = 0.8;
            const interval = 0.15;

            // 1. 根據年級設定專屬基音 Frequency
            let rootFreq = notes['C4']; // P1
            if (grade === 2) rootFreq = notes['D4']; // P2
            if (grade === 3) rootFreq = notes['E4']; // P3
            if (grade === 4) rootFreq = notes['F4']; // P4
            if (grade === 5) rootFreq = notes['G4']; // P5
            if (grade === 6) rootFreq = notes['A4']; // P6

            // 2. 根據班別設定和弦音程
            let freqs = [];
            if (cls === 'A') {
                freqs = [rootFreq, rootFreq * 1.25, rootFreq * 1.5, rootFreq * 2.0];
            } else if (cls === 'B') {
                freqs = [rootFreq, rootFreq * 1.125, rootFreq * 1.25, rootFreq * 1.5];
            } else if (cls === 'C') {
                freqs = [rootFreq, rootFreq * 1.334, rootFreq * 1.667, rootFreq * 2.0];
            } else if (cls === 'D') {
                freqs = [rootFreq, rootFreq * 1.25, rootFreq * 1.5, rootFreq * 1.875];
            } else if (cls === 'E') {
                freqs = [rootFreq, rootFreq * 1.5, rootFreq * 2.0, rootFreq * 2.5];
            } else {
                freqs = [rootFreq, rootFreq * 1.125, rootFreq * 1.25, rootFreq * 1.414];
            }

            // 3. 播放 4 音和弦鈴聲
            playTone(freqs[0], now, noteDuration);
            playTone(freqs[1], now + interval, noteDuration);
            playTone(freqs[2], now + interval * 2, noteDuration);
            playTone(freqs[3], now + interval * 3, noteDuration);
        }

        window.toggleSound = function() {
            window.isSoundEnabled = !window.isSoundEnabled;
            const soundBtn = document.getElementById('btn-sound-toggle');
            if (window.isSoundEnabled) {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                soundBtn.className = "px-3 py-2 rounded text-xs md:text-sm font-bold bg-green-600 hover:bg-green-500 text-white flex items-center gap-1 shadow transition-colors";
                soundBtn.innerHTML = `<span>🔊</span> 音效: 開`;
                playChime("1A"); // 開啟時播放測試音效 (1A)
            } else {
                soundBtn.className = "px-3 py-2 rounded text-xs md:text-sm font-bold bg-red-600 hover:bg-red-500 text-white flex items-center gap-1 shadow transition-colors";
                soundBtn.innerHTML = `<span>🔇</span> 音效: 關`;
            }
        };

        window.toggleLedWallOrder = function() {
            window.isLedWallSwapped = !window.isLedWallSwapped;
            const container = document.getElementById('board-container');
            const linesContainer = document.getElementById('led-lines-container');
            if (window.isLedWallSwapped) {
                container.style.order = "2";
                linesContainer.style.order = "1";
            } else {
                container.style.order = "1";
                linesContainer.style.order = "2";
            }
        };

        window.changeClassMode = function(mode) {
            window.currentClassMode = mode;
            const normalBtn = document.getElementById('btn-class-normal');
            const assessBtn = document.getElementById('btn-class-assessment');

            if (mode === 'normal') {
                normalBtn.className = "flex-1 md:flex-none px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors bg-purple-600 text-white shadow-lg";
                assessBtn.className = "flex-1 md:flex-none px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white";
            } else {
                normalBtn.className = "flex-1 md:flex-none px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white";
                assessBtn.className = "flex-1 md:flex-none px-3 py-1 rounded text-xs md:text-sm font-bold transition-colors bg-purple-600 text-white shadow-lg";
            }
            initBoard();
            if (window.lastData) applyDataToUI(window.lastData, false);
        };

        window.changeLayout = function(mode) {
            window.currentLayout = mode;
            
            const tvBtn = document.getElementById('btn-mode-tv');
            const ledBtn = document.getElementById('btn-mode-led');
            const mobileBtn = document.getElementById('btn-mode-mobile');
            
            const header = document.getElementById('main-header');
            const container = document.getElementById('board-container');
            const linesContainer = document.getElementById('led-lines-container');
            const wrapper = document.getElementById('screen-wrapper');
            
            const baseBtnClass = "px-3 md:px-4 py-1 rounded text-xs md:text-sm font-bold transition-colors text-gray-400 hover:text-white whitespace-nowrap";
            const activeBtnClass = "px-3 md:px-4 py-1 rounded text-xs md:text-sm font-bold transition-colors bg-blue-600 text-white shadow-lg whitespace-nowrap";
            
            tvBtn.className = baseBtnClass;
            ledBtn.className = (mode === 'led_wall') ? activeBtnClass.replace('bg-blue-600', 'bg-teal-600') : baseBtnClass; 
            mobileBtn.className = baseBtnClass;

            wrapper.style.maxWidth = "177.78vh";
            wrapper.style.aspectRatio = "16/9";
            wrapper.style.height = "auto";
            wrapper.style.width = "100%";
            wrapper.classList.remove('justify-between');
            
            container.style.height = "auto";
            container.style.maxHeight = "none";
            container.style.overflowY = "visible";
            container.style.flex = "none"; 

            if (linesContainer) linesContainer.classList.add('hidden');

            if (mode === 'tv_mode') {
                tvBtn.className = activeBtnClass;
                
                header.style.order = "0"; 
                header.classList.remove('mt-auto'); 
                header.classList.add('mb-2');
                
                container.style.order = "1";
                container.style.flex = "1"; 
                container.style.height = "100%"; 
                container.style.overflowY = "hidden";

            } else if (mode === 'led_wall') {
                ledBtn.className = activeBtnClass.replace('bg-blue-600', 'bg-teal-600');
                
                header.style.order = "3"; 
                header.classList.remove('mb-2');
                header.classList.add('mt-auto'); 
                
                if (window.isLedWallSwapped) {
                    container.style.order = "2";
                } else {
                    container.style.order = "1";
                }
                
                if (linesContainer) {
                    if (window.isLedWallSwapped) {
                        linesContainer.style.order = "1";
                    } else {
                        linesContainer.style.order = "2";
                    }
                    linesContainer.classList.remove('hidden');
                    renderLedLines(); 
                }

                wrapper.classList.add('justify-between');

            } else if (mode === 'mobile_mode') {
                mobileBtn.className = activeBtnClass.replace('bg-blue-600', 'bg-orange-600');
                
                wrapper.style.maxWidth = "100%";
                wrapper.style.aspectRatio = "unset";
                wrapper.style.height = "100vh"; 
                
                header.style.order = "0";
                header.classList.remove('mt-auto');
                header.classList.add('mb-4');
                
                container.style.order = "1";
                container.style.height = "100%"; 
                container.style.overflowY = "auto";
            }

            initBoard();
            if (window.lastData) applyDataToUI(window.lastData, false);
        };

        function renderLedLines() {
            const container = document.getElementById('led-lines-container');
            if (!container) return;

            container.innerHTML = `
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-xs md:text-sm font-bold text-teal-300 tracking-wider flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-teal-400"></span>
                        放學線段指示區 (14 - 1 號線)
                    </span>
                    <button onclick="toggleLedWallOrder()" class="px-2 py-1 bg-teal-600 hover:bg-teal-500 text-white rounded text-xs font-bold transition-colors shadow">
                        上下互換
                    </button>
                </div>
                <div style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 2px;" class="w-full bg-gray-900/90 p-1 rounded-lg border border-gray-700 shadow-inner">
                    ${lineData.map(item => `
                        <div class="flex flex-col border border-gray-600 rounded bg-gray-800 text-center overflow-hidden">
                            <div class="p-0.5 text-xs font-bold text-yellow-300 bg-gray-800 border-b border-gray-600 min-h-[28px] flex items-center justify-center leading-tight">
                                <span>${item.extraRow || ''}</span>
                            </div>
                            <div class="bg-gray-700 text-blue-300 font-black py-0.5 text-xs md:text-base border-b border-gray-600">
                                ${item.id}
                            </div>
                            <div class="p-1 flex items-center justify-center flex-1 text-xs md:text-sm font-bold text-gray-100 leading-tight min-h-[50px] bg-gray-900/50">
                                <span>${item.name}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function getClassesForGrade(grade) {
            let classes = ['A', 'B', 'C', 'D'];
            const mode = window.currentClassMode;
            if ([1, 3, 5, 6].includes(grade)) classes.push('E');
            if (mode === 'assessment') {
                if ([3, 4, 5, 6].includes(grade)) classes.push('S');
            }
            return classes;
        }

        function getAllPossibleClasses(grade) {
            let classes = ['A', 'B', 'C', 'D'];
            if ([1, 3, 5, 6].includes(grade)) classes.push('E');
            if ([3, 4, 5, 6].includes(grade)) classes.push('S');
            return classes;
        }

        function getHKDateString() {
            return new Date().toLocaleDateString("en-CA", {timeZone: "Asia/Hong_Kong"});
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCAnYlgsGceAYXKLlw0P-RS9N-1ydayxhc",
            authDomain: "claist-da546.firebaseapp.com",
            databaseURL: "https://claist-da546-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "claist-da546",
            storageBucket: "claist-da546.firebasestorage.app",
            messagingSenderId: "68170044054",
            appId: "1:68170044054:web:db2565be3216d3fc33e8b7",
            measurementId: "G-MVH87242TX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const COLLECTION_NAME = 'class_board_data';
        const DOC_ID = 'main_status'; 
        const statusDocRef = doc(db, COLLECTION_NAME, DOC_ID);

        const container = document.getElementById('board-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        let currentDbDate = null;
        window.lastData = {};
        let isFirstLoad = true;

        function initBoard() {
            container.innerHTML = ''; 

            if (window.currentLayout === 'tv_mode') {
                container.className = "w-full flex flex-col gap-2 mx-auto pr-2 h-full pb-2";
                
                grades.forEach(grade => {
                    const currentClasses = getClassesForGrade(grade);
                    const row = document.createElement('div');
                    row.className = 'bg-gray-800/50 rounded-lg p-2 border border-gray-700/50 flex flex-col md:flex-row items-center gap-3 flex-1';
                    
                    const titleContainer = document.createElement('div');
                    titleContainer.className = 'flex items-center justify-center md:justify-start w-full md:w-24 shrink-0 border-b md:border-b-0 md:border-r border-gray-600 pb-2 md:pb-0 md:pr-4 h-full';
                    
                    const title = document.createElement('h2');
                    title.className = 'text-lg md:text-xl font-bold text-blue-300 flex items-center h-full';
                    title.innerText = `${numToChinese[grade]}年`;
                    titleContainer.appendChild(title);
                    row.appendChild(titleContainer);

                    const btnContainer = document.createElement('div');
                    const colCount = currentClasses.length > 6 ? 8 : 6;
                    btnContainer.className = `grid grid-cols-4 md:grid-cols-${colCount} gap-2 w-full h-full`;

                    currentClasses.forEach(cls => {
                        createButton(grade, cls, btnContainer, 'tv_mode');
                    });
                    row.appendChild(btnContainer);
                    container.appendChild(row);
                });

            } else if (window.currentLayout === 'led_wall') {
                container.className = "w-full grid grid-cols-6 gap-1 px-1 h-[25%] items-start";

                grades.forEach(grade => {
                    const currentClasses = getClassesForGrade(grade);
                    const col = document.createElement('div');
                    col.className = 'flex flex-col gap-0.5 h-full';
                    
                    const btnContainer = document.createElement('div');
                    btnContainer.className = 'flex flex-col gap-0.5 w-full h-full';

                    currentClasses.forEach(cls => {
                        createButton(grade, cls, btnContainer, 'led_wall', currentClasses.length);
                    });
                    col.appendChild(btnContainer);
                    container.appendChild(col);
                });

            } else if (window.currentLayout === 'mobile_mode') {
                container.className = "w-full flex flex-col gap-4 pb-32 px-2";

                grades.forEach(grade => {
                    const currentClasses = getClassesForGrade(grade);
                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-xl p-4 border border-gray-700 shadow-md';
                    
                    const title = document.createElement('h2');
                    title.className = 'text-xl font-bold text-blue-300 mb-3 border-b border-gray-600 pb-2';
                    title.innerText = `${numToChinese[grade]}年級`;
                    card.appendChild(title);

                    const btnContainer = document.createElement('div');
                    let gridColsClass = 'grid-cols-4';
                    if (currentClasses.length === 5) {
                        gridColsClass = 'grid-cols-5';
                    } else if (currentClasses.length >= 6) {
                        gridColsClass = 'grid-cols-3';
                    }
                    btnContainer.className = `grid ${gridColsClass} gap-2`;

                    currentClasses.forEach(cls => {
                        createButton(grade, cls, btnContainer, 'mobile_mode');
                    });
                    card.appendChild(btnContainer);
                    container.appendChild(card);
                });

                // 手機模式下於 6 年級下方加入兩行空白佔位區
                const spacer1 = document.createElement('div');
                spacer1.className = 'h-12 w-full flex-shrink-0';
                container.appendChild(spacer1);

                const spacer2 = document.createElement('div');
                spacer2.className = 'h-12 w-full flex-shrink-0';
                container.appendChild(spacer2);
            }
        }

        function createButton(grade, cls, parent, mode, classCount = 0) {
            const btn = document.createElement('button');
            const classId = `${grade}${cls}`;
            
            btn.id = `btn-${classId}`;
            
            if (mode === 'tv_mode') {
                btn.className = `class-btn w-full h-full rounded-lg font-black text-3xl md:text-5xl border border-gray-600 text-gray-400 hover:border-blue-400 hover:text-blue-300 focus:outline-none select-none bg-gray-900 flex items-center justify-center`;
            } else if (mode === 'led_wall') {
                btn.className = `class-btn flex-1 w-full rounded font-black border-2 border-gray-600 text-gray-500 hover:border-blue-400 hover:text-blue-300 focus:outline-none select-none bg-gray-900 leading-none tracking-wider flex items-center justify-center`;
                if (classCount >= 7) {
                    btn.style.fontSize = "clamp(1rem, 2.5vh, 2rem)"; 
                } else {
                    btn.style.fontSize = "clamp(1.5rem, 4vh, 3rem)"; 
                }
            } else if (mode === 'mobile_mode') {
                btn.className = `class-btn h-12 md:h-14 rounded-lg font-bold text-lg md:text-xl border border-gray-600 text-gray-400 active:border-blue-400 active:text-blue-300 focus:outline-none select-none bg-gray-900 shadow-sm flex items-center justify-center min-w-0`;
            }
            
            btn.innerText = classId;
            btn.onclick = () => handleBtnClick(classId);
            parent.appendChild(btn);
        }

        async function handleBtnClick(classId) {
            if (!auth.currentUser) return;
            const btn = document.getElementById(`btn-${classId}`);
            if (!btn) return;
            
            let hasGlow = false;
            for(let i=1; i<=6; i++) {
                if(btn.classList.contains(`glow-${i}`)) hasGlow = true;
            }
            const newState = !hasGlow; 

            try {
                await setDoc(statusDocRef, { [classId]: newState }, { merge: true });
            } catch (error) {
                console.error("更新失敗:", error);
            }
        }

        async function performDailyReset(todayStr) {
            console.log("執行自動重置:", todayStr);
            const resetData = { lastResetDate: todayStr };
            grades.forEach(g => {
                getAllPossibleClasses(g).forEach(c => {
                    resetData[`${g}${c}`] = false;
                });
            });
            try { await setDoc(statusDocRef, resetData); } catch (e) { console.error(e); }
        }

        function setupRealtimeListener() {
            onSnapshot(statusDocRef, (docSnapshot) => {
                const data = docSnapshot.data() || {};
                
                currentDbDate = data.lastResetDate;
                const today = getHKDateString();
                if (currentDbDate !== today) {
                    performDailyReset(today);
                    return; 
                }

                applyDataToUI(data, !isFirstLoad); 
                window.lastData = data; 
                isFirstLoad = false;
                
                loadingOverlay.style.display = 'none';
            }, (error) => {
                console.error("同步錯誤:", error);
                loadingOverlay.innerHTML = `<p class="text-red-400">連線中斷<br><span class="text-sm">${error.message}</span></p>`;
            });

            setInterval(() => {
                const today = getHKDateString();
                if (currentDbDate && currentDbDate !== today) performDailyReset(today);
            }, 60000); 
        }

        function applyDataToUI(newData, shouldTriggerAudio = true) {
            const allBtns = document.querySelectorAll('button[id^="btn-"]');
            allBtns.forEach(btn => {
                const classId = btn.id.replace('btn-', '');
                const isNowActive = newData[classId] === true;
                const wasActive = window.lastData[classId] === true;

                updateButtonUI(classId, isNowActive);

                // 當點亮該班級時，傳入 classId 播放專屬音效
                if (shouldTriggerAudio && isNowActive && !wasActive) {
                    playChime(classId);
                }
            });
        }

        function updateButtonUI(classId, isActive) {
            const btn = document.getElementById(`btn-${classId}`);
            if (!btn) return;

            const grade = parseInt(classId.charAt(0));
            const glowClass = `glow-${grade}`;

            for(let i=1; i<=6; i++) btn.classList.remove(`glow-${i}`);
            btn.classList.remove('border-transparent');

            if (isActive) {
                btn.classList.add(glowClass, 'border-transparent');
                btn.classList.remove('border-gray-600', 'text-gray-400', 'text-gray-500', 'bg-gray-900');
            } else {
                const defaultTextColor = window.currentLayout === 'led_wall' ? 'text-gray-500' : 'text-gray-400';
                btn.classList.add('border-gray-600', defaultTextColor, 'bg-gray-900');
            }
        }

        async function startApp() {
            window.changeClassMode('normal');
            window.changeLayout('tv_mode'); 

            try { await signInAnonymously(auth); } 
            catch (error) { 
                console.error("登入失敗:", error);
                loadingOverlay.innerHTML = `<p class="text-red-400 text-center px-4">API 設定錯誤<br><span class="text-xs">${error.code}</span></p>`;
            }

            onAuthStateChanged(auth, (user) => {
                if (user) setupRealtimeListener();
            });
        }

        startApp();
    </script>
</body>
</html>
